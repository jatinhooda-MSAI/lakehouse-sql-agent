[project]
name = "lakehouse-sql-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.11.0",
    "duckdb>=1.5.6",
    "openai>=3.26.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pyyaml>=6.0.3",
    "sqlglot>=30.21.0",
]

[project.scripts]
ask = "sqlagent.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sqlagent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
