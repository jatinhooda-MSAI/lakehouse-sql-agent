- id: e15
  level: easy
  question: How many 311 requests created in 2025 came in by phone call, counting duplicates?
  sql: |
    SELECT COUNT(*) FROM silver.stg_311_requests
    WHERE origin = 'Phone Call'
      AND created_at >= TIMESTAMP '2025-01-01' AND created_at < TIMESTAMP '2026-01-01'

- id: m01
  level: medium
  question: Which primary crime type had the most incidents in 2025? Return the type and its incident count.
  sql: |
    SELECT primary_type, SUM(incidents) AS incidents
    FROM gold.fct_crimes_daily
    WHERE crime_date >= DATE '2025-01-01' AND crime_date < DATE '2026-01-01'
    GROUP BY primary_type
    ORDER BY incidents DESC
    LIMIT 1

- id: m02
  level: medium
  question: Which 5 community areas had the most crime incidents in July 2026? Return the community area name and the incident count.
  sql: |
    SELECT d.community_area_name, SUM(f.incidents) AS incidents
    FROM gold.fct_crimes_daily f
    JOIN gold.dim_community_area d USING (community_area)
    WHERE f.crime_date >= DATE '2026-07-01' AND f.crime_date < DATE '2026-08-01'
    GROUP BY d.community_area_name
    ORDER BY incidents DESC
    LIMIT 5

- id: m03
  level: medium
  question: What were the total crime incidents in each month from January to June 2026? Return the first day of the month and the count.
  sql: |
    SELECT month, SUM(incidents) AS incidents
    FROM gold.mart_area_month
    WHERE month BETWEEN DATE '2026-01-01' AND DATE '2026-06-01'
    GROUP BY month
    ORDER BY month

- id: m04
  level: medium
  question: Which date in 2025 had the most crime incidents? Return the date and the count.
  sql: |
    SELECT crime_date, SUM(incidents) AS incidents
    FROM gold.fct_crimes_daily
    WHERE crime_date >= DATE '2025-01-01' AND crime_date < DATE '2026-01-01'
    GROUP BY crime_date
    ORDER BY incidents DESC
    LIMIT 1

- id: m05
  level: medium
  question: What fraction of narcotics incidents in 2025 led to an arrest?
  sql: |
    SELECT SUM(arrests) / SUM(incidents)
    FROM gold.fct_crimes_daily
    WHERE primary_type = 'NARCOTICS'
      AND crime_date >= DATE '2025-01-01' AND crime_date < DATE '2026-01-01'

- id: m06
  level: medium
  question: Which 311 request type had the most non-duplicate requests opened in May 2026? Return the type and the count.
  sql: |
    SELECT sr_type, SUM(requests_opened) AS requests_opened
    FROM gold.fct_311_daily
    WHERE activity_date >= DATE '2026-05-01' AND activity_date < DATE '2026-06-01'
    GROUP BY sr_type
    ORDER BY requests_opened DESC
    LIMIT 1

- id: m07
  level: medium
  question: What was the average number of crime incidents per day in February 2026?
  sql: |
    SELECT AVG(daily)
    FROM (
      SELECT crime_date, SUM(incidents) AS daily
      FROM gold.fct_crimes_daily
      WHERE crime_date >= DATE '2026-02-01' AND crime_date < DATE '2026-03-01'
