    )

- id: m08
  level: medium
  question: What fraction of crime incidents in 2025 were domestic?
  sql: |
    SELECT SUM(domestic_incidents) / SUM(incidents)
    FROM gold.fct_crimes_daily
    WHERE crime_date >= DATE '2025-01-01' AND crime_date < DATE '2026-01-01'

- id: m09
  level: medium
  question: Which police district had the most crime incidents that occurred in 2025? Return the district and the count.
  sql: |
    SELECT district, COUNT(*) AS incidents
    FROM silver.stg_crimes
    WHERE occurred_at >= TIMESTAMP '2025-01-01' AND occurred_at < TIMESTAMP '2026-01-01'
    GROUP BY district
    ORDER BY incidents DESC
    LIMIT 1

- id: m10
  level: medium
  question: Which 5 location descriptions had the most thefts in 2025? Return the location description and the count.
  sql: |
    SELECT location_description, COUNT(*) AS thefts
    FROM silver.stg_crimes
    WHERE primary_type = 'THEFT'
      AND occurred_at >= TIMESTAMP '2025-01-01' AND occurred_at < TIMESTAMP '2026-01-01'
    GROUP BY location_description
    ORDER BY thefts DESC
